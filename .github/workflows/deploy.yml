name: Deploy to Cloudflare

# main → Worker dantes-sud (prod), develop → Worker dantes-sud-dev (wrangler env "dev").
# Pull requests only build.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'production' || 'development') || null }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build Astro
        run: bun run build

      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy${{ github.ref_name == 'develop' && ' --env dev' || '' }}
